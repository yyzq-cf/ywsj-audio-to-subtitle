<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始化 - 音频转字幕</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3a;
            --text: #e4e4e7;
            --muted: #71717a;
            --accent: #3b82f6;
            --error: #ef4444;
        }
        [data-theme="light"] {
            --bg: #f5f5f5;
            --card: #ffffff;
            --border: #e4e4e7;
            --text: #1a1a2e;
            --muted: #71717a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            transition: background 0.3s, color 0.3s;
        }
        .login-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 40px; width: 360px; max-width: 90vw;
        }
        .login-card h1 { font-size: 22px; text-align: center; margin-bottom: 8px; }
        .login-card .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 12px 14px; border-radius: 8px; width: 100%; font-size: 15px;
        }
        input:focus { outline: none; border-color: var(--accent); }
        .btn {
            background: var(--accent); color: white; border: none;
            padding: 12px; border-radius: 8px; width: 100%;
            font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
        }
        .btn:hover { background: #2563eb; }
        .error-msg { color: var(--error); font-size: 13px; text-align: center; margin-bottom: 16px; }
        .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
        .footer a { color: var(--accent); text-decoration: none; }
        .header-right { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        .theme-btn {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 16px;
        }
        .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 12px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="header-right">
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        <a href="https://github.com/yyzq-cf/ywsj-audio-to-subtitle" target="_blank" class="theme-btn" style="display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--text);" title="GitHub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            </a>
    </div>
    <h1>🎬 音频转字幕</h1>
    <p class="subtitle">首次使用，请设置管理员账号</p>
    {% if error %}
    <p class="error-msg">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/setup">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" autofocus required placeholder="设置用户名">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" required placeholder="至少4位">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" name="confirm" required placeholder="再次输入密码">
        </div>
        <button type="submit" class="btn">完成初始化</button>
    </form>
    <p class="hint">设置后此账号将用于登录，可在使用中修改密码</p>
    <div class="footer">
        <p>ywsj-sub-translator · <a href="https://github.com/yyzq-cf/ywsj-audio-to-subtitle" target="_blank">GitHub</a></p>
    </div>
</div>
<script>
function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme');
    if (current === 'light') {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('themeBtn').textContent = '🌙';
        localStorage.setItem('theme', 'dark');
    } else {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeBtn').textContent = '☀️';
        localStorage.setItem('theme', 'light');
    }
}
var savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeBtn').textContent = '☀️';
}
</script>
</body>
</html>
